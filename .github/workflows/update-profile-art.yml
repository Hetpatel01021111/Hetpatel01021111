name: Profile art

on:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_PROFILE_USER: Hetpatel01021111
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Validate committed artwork and reproduce it from source
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.make_ascii_svg
          python -m scripts.render_readme_cards
          git diff --exit-code -- het-ascii.svg cards/

  refresh:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Fetch public contributions, render, and validate
        run: |
          python -m scripts.fetch_contributions
          python -m scripts.render_readme_cards
          python -m unittest discover -s tests -v
      - name: Commit refreshed artwork when data changes
        run: |
          git add -- data/contributions.json cards/
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh public GitHub contribution cards'
          git push origin "HEAD:${GITHUB_REF}"
